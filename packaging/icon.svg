<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F4C"/>
      <stop offset="1" stop-color="#101223"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#sheen)"/>
  <rect x="66" y="66" width="892" height="892" rx="210" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="5"/>

  <!-- chip pins -->
  <g fill="#C9CEE6">
    <rect x="394" y="256" width="36" height="58" rx="18"/>
    <rect x="494" y="256" width="36" height="58" rx="18"/>
    <rect x="594" y="256" width="36" height="58" rx="18"/>
    <rect x="394" y="710" width="36" height="58" rx="18"/>
    <rect x="494" y="710" width="36" height="58" rx="18"/>
    <rect x="594" y="710" width="36" height="58" rx="18"/>
    <rect x="256" y="394" width="58" height="36" rx="18"/>
    <rect x="256" y="494" width="58" height="36" rx="18"/>
    <rect x="256" y="594" width="58" height="36" rx="18"/>
    <rect x="710" y="394" width="58" height="36" rx="18"/>
    <rect x="710" y="494" width="58" height="36" rx="18"/>
    <rect x="710" y="594" width="58" height="36" rx="18"/>
  </g>

  <!-- chip body -->
  <rect x="312" y="312" width="400" height="400" rx="64" fill="none"
        stroke="#EDEFF8" stroke-width="36"/>

  <!-- the two numbers: CPU (teal) and disk (amber) -->
  <rect x="384" y="348" width="96" height="300" rx="30" fill="#5EEAD4"/>
  <rect x="544" y="458" width="96" height="190" rx="30" fill="#FBBF24"/>
</svg>
